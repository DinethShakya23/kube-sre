# kube-sre's identity in the demo cluster: read only (view), plus pod and node metrics and
# namespaces. It can list, get and watch; it cannot read secrets, create, delete, patch or exec.
apiVersion: v1
kind: Namespace
metadata: {name: sre-agent}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-sre, namespace: sre-agent}
---
apiVersion: v1
kind: Secret
metadata:
  name: kube-sre-token
  namespace: sre-agent
  annotations: {kubernetes.io/service-account.name: kube-sre}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kube-sre-view}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: kube-sre, namespace: sre-agent}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kube-sre-extra-read}
rules:
- apiGroups: [metrics.k8s.io]
  resources: [pods, nodes]
  verbs: [get, list]
- apiGroups: [""]
  resources: [nodes, namespaces]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kube-sre-extra-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-sre-extra-read}
subjects: [{kind: ServiceAccount, name: kube-sre, namespace: sre-agent}]
