name: InitContainerFailing
detect:
  watch_predicates:
    - kind: Pod
      status_regex: "^Init:(CrashLoopBackOff|Error)$"
    # Stuck progress arm. The debounce below is what stops normal startups firing.
    - kind: Pod
      status_regex: "^Init:[0-9]+/[0-9]+$"
    - kind: Event
      reason_regex: "^BackOff$"
      message_regex: "back-off restarting failed init|init container"
  promql:
    - 'increase(kube_pod_init_container_status_restarts_total[10m]) > 3'
  debounce_seconds: 180
triggers:
  - pod_status_regex: "Init:[0-9]+/[0-9]+"
  - event_reason_regex: "BackOff"
  - event_message_regex: "back-off restarting failed init|init container.*failed"
investigation_steps:
  - "kubectl get pods -n <ns> -o wide to confirm the Init status and find the failing init container."
  - "kubectl describe pod <pod> -n <ns> and read the Init Containers section for exit codes and state."
  - "kubectl logs <pod> -n <ns> -c <init-container> --previous --tail=50 for the crash output."
  - "Check the init container's image, command, env and volume mounts."
  - "kubectl get events -n <ns> --sort-by=.lastTimestamp to confirm the BackOff sequence."
expected_evidence:
  - "The init container name and its exit code"
  - "The error output from its logs"
  - "Whether the cause is a bad command, a missing secret or configmap, or an image problem"
recommended_fix_template: |
  Init container <INIT_CONTAINER_NAME> fails before the main container can start.
  Exit code <EXIT_CODE>. Cause: <CAUSE>.
  Fix: <ACTION>, for example correct the command, make sure <SECRET_OR_CONFIGMAP>
  exists in <NAMESPACE>, or fix pull access to <IMAGE>.
  Then: kubectl rollout restart deployment/<DEPLOYMENT> -n <NAMESPACE>
