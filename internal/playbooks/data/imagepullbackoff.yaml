name: ImagePullBackOff
detect:
  watch_predicates:
    - kind: Pod
      status_regex: "ImagePullBackOff|ErrImagePull|InvalidImageName"
    - kind: Event
      reason_regex: "^(Failed|ErrImagePull|BackOff)$"
      message_regex: "Failed to pull image|Back-off pulling image"
      involved_kind: Pod
  promql:
    - 'kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName"} == 1'
  debounce_seconds: 90
triggers:
  - pod_status_regex: "ImagePullBackOff|ErrImagePull"
  - event_reason_regex: "Failed|ErrImagePull"
investigation_steps:
  - "kubectl describe pod <pod> -n <ns> and read the exact pull error in Events."
  - "kubectl get events -n <ns> --sort-by=.lastTimestamp to confirm the registry or image error."
  - "Check the image reference (registry, repo, tag) and whether the pod has a pull secret."
expected_evidence:
  - "A pull error naming the exact registry and tag"
  - "An auth error, meaning a missing or wrong pull secret for a private registry"
  - "404 or manifest unknown, meaning the tag is wrong"
recommended_fix_template: |
  The image cannot be pulled. Likely cause: <CAUSE> (wrong tag, missing pull secret,
  or unreachable registry). Suggested fix: <ACTION>, such as correcting the tag,
  adding an imagePullSecret, or fixing the registry host name.
